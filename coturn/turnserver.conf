# Connecta — coturn TURN relay configuration.
#
# Credentials use the shared-secret / REST scheme: the Connecta server mints
# short-lived HMAC-SHA1 credentials and coturn validates them against the same
# static-auth-secret. Do NOT put real usernames/passwords here.
#
# The secret and realm are injected at runtime (see docker-compose.yml) so this
# file never contains secrets. For a bare-metal install, set them via CLI flags:
#   turnserver -c turnserver.conf --static-auth-secret=<same as TURN_SECRET> --realm=<your realm>

# --- Listening -------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# REQUIRED for NAT: your server's public IP (or public-ip/private-ip pair).
# Set via --external-ip at runtime, e.g. --external-ip=203.0.113.10
# external-ip=203.0.113.10

# --- Auth (shared secret / REST) -------------------------------------------
use-auth-secret
# static-auth-secret is supplied at runtime; keep it identical to TURN_SECRET
# in the Connecta server environment.
realm=connecta.local

# --- Relay port range ------------------------------------------------------
min-port=49152
max-port=65535

# --- Safety / hardening ----------------------------------------------------
fingerprint
no-loopback-peers
no-multicast-peers
no-cli
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# --- Logging ---------------------------------------------------------------
log-file=/var/log/turnserver/turnserver.log
simple-log
# verbose   ; uncomment while debugging

# --- TLS (turns:// on 5349) -------------------------------------------------
# Provide a cert/key to enable TURNS. Without these, only turn:// (3478) works.
# cert=/etc/turnserver/turn_cert.pem
# pkey=/etc/turnserver/turn_key.pem
